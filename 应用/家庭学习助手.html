#app { --mod: var(--blue); --mod-t: var(--blue-t); --mod-s: var(--blue-s); }

      TTS ? h('p', { class: 'muted small' }, d.playing ? '正在自动朗读，点圆形按钮可以暂停' : '已暂停') : null,
      h('div', { class: 'row', style: 'width:100%' },
        TTS ? h('button', { type: 'button', class: 'btn grow', onclick: function () { runFrom(d.idx); } }, '重读这个') : null,
        h('button', { type: 'button', class: 'btn grow', onclick: function () {
          if (d.idx + 1 >= n) { stopSpeak(); d.phase = 'check'; render(); window.scrollTo(0, 0); }
          else if (TTS) runFrom(d.idx + 1); else { d.idx++; render(); }
        } }, d.idx + 1 >= n ? '写完了' : '下一个')),
      h('button', { type: 'button', class: 'link', onclick: function () { d.show = !d.show; render(); } }, d.show ? '隐藏文字' : '显示文字（给家长看，或者没有声音时用）')));
    kids.push(h('button', { type: 'button', class: 'btn block', onclick: function () { stopSpeak(); d.phase = 'check'; render(); window.scrollTo(0, 0); } }, '结束听写，开始核对'));
    return kids;
  }

  if (d.phase === 'check') {
    var wrongN = Object.keys(d.wrong).filter(function (k) { return d.wrong[k]; }).length;
    kids.push(h('section', { class: 'card' }, h('h2', null, '核对'), h('p', { class: 'muted' }, '对照孩子的本子，点一下写错的字。再点一次可以取消。'),
      h('div', { class: 'words' }, d.words.map(function (w, i) { return h('button', { type: 'button', class: 'word', 'aria-pressed': d.wrong[i] ? 'true' : 'false', onclick: function () { d.wrong[i] = !d.wrong[i]; render(); } }, w); })),
      d.checkNote ? h('p', { class: 'notice info' }, d.checkNote) : null,
      S.sample && S.canImages ? h('label', { class: 'btn', for: 'dict-check' }, icon('camera', 20), '拍孩子写的，让 AI 先核对一遍',
        h('input', { type: 'file', id: 'dict-check', class: 'visually-hidden', accept: S.imgTypes, onchange: function (e) { var f = e.target.files && e.target.files[0]; if (f) checkPhoto(f); } })) : null));
    if (d.error) kids.push(h('p', { class: 'notice' }, d.error));
    kids.push(h('button', { type: 'button', class: 'btn primary block', onclick: function () {
      var wrong = d.words.filter(function (w, i) { return d.wrong[i]; });
      addDoc('dictations', 'dictations', { child: S.child, subject: d.subject, words: d.words, wrong: wrong, createdAt: Date.now() }).catch(function () {}).then(function () {
        S.dict = freshDict(); S.dict.subject = d.subject; S.tab = 'today';
        S.flash = wrong.length ? '听写已记录，写错了 ' + wrong.length + ' 个。下次可以点“再听写”只练这几个。' : '听写已记录，全部写对了。';
        render(); window.scrollTo(0, 0);
      });
    } }, wrongN ? '保存，写错了 ' + wrongN + ' 个' : '保存，全部写对了'));
    kids.push(h('button', { type: 'button', class: 'btn block', onclick: function () { S.dict = freshDict(); render(); } }, '不保存，重新开始'));
    return kids;
  }
  return kids;
}

/* ---------- 周报 ---------- */
function reportView() {
  var rep = S.rep, subs = ['全部'].concat(KIDS[S.child].subjects), since = Date.now() - 7 * 864e5, kids = [];
  var all = myMistakes().filter(function (m) { return rep.subject === '全部' || m.subject === rep.subject; });
  var wk = all.filter(function (m) { return (m.createdAt || 0) >= since; }), open = all.filter(function (m) { return !m.mastered; });
  var done = all.filter(function (m) { return m.mastered && (m.masteredAt || 0) >= since; });
  var ds = S.dictations.filter(function (d) { return d.child === S.child && (d.createdAt || 0) >= since && (rep.subject === '全部' || d.subject === rep.subject); });
  kids.push(h('div', { class: 'chips' }, subs.map(function (s) { return chip(s, rep.subject === s, function () { rep.subject = s; rep.text = ''; rep.error = ''; render(); }); })));
  kids.push(h('section', { class: 'card' }, h('p', { class: 'muted small' }, fmtDate(since) + ' 至 ' + fmtDate()),
    h('div', { class: 'stats' },
      h('div', null, h('span', { class: 'stat' }, wk.length), h('span', { class: 'muted small' }, '录入错题')),
      h('div', null, h('span', { class: 'stat' }, done.length), h('span', { class: 'muted small' }, '新掌握')),
      h('div', null, h('span', { class: 'stat' }, ds.length), h('span', { class: 'muted small' }, '听写次数')))));

  var groups = {}, causes = {};
  open.forEach(function (m) {
    var key = m.subject + '|' + (m.knowledge || '未分类');
    var g = groups[key] || (groups[key] = { subject: m.subject, knowledge: m.knowledge || '未分类', n: 0, causes: {} });
    g.n++; g.causes[m.cause] = (g.causes[m.cause] || 0) + 1; causes[m.cause] = (causes[m.cause] || 0) + 1;
  });
  var weak = Object.keys(groups).map(function (k) { return groups[k]; }).sort(function (a, b) { return b.n - a.n; }).slice(0, 5);
  if (!weak.length) {
    kids.push(h('section', { class: 'card' }, h('h2', null, '还没有可以分析的错题'),
      h('p', { class: 'muted' }, '保存几道错题后，这里会列出最弱的知识点、错因的分布，以及下周的练习安排。')));
  } else {
    kids.push(h('section', { class: 'card' }, h('h2', null, '最弱的知识点'), h('ul', { class: 'plain' }, weak.map(function (g) {
      var top = Object.keys(g.causes).sort(function (a, b) { return g.causes[b] - g.causes[a]; })[0];
      return h('li', { class: 'row nowrap' }, h('span', { class: 'grow' }, g.knowledge), tag(g.subject, SUBJ_CLASS[g.subject]), tag(CAUSE[top] || '其他'), h('span', { class: 'muted small', style: 'white-space:nowrap' }, '错 ' + g.n + ' 次'));
    }))));
    var order = ['concept', 'misread', 'careless', 'memory'].filter(function (k) { return causes[k]; });
    kids.push(h('section', { class: 'card' }, h('h2', null, '错因分布'),
      h('div', { class: 'dist', role: 'img', 'aria-label': order.map(function (k) { return CAUSE[k] + ' ' + causes[k] + ' 道'; }).join('，') },
        order.map(function (k) { return h('div', { style: 'flex:' + causes[k] + ';background:' + CAUSE_COLOR[k] }); })),
      h('div', { class: 'legend' }, order.map(function (k) { return h('span', null, h('i', { style: 'background:' + CAUSE_COLOR[k] }), CAUSE[k] + ' ' + causes[k]); }))));
  }
  var wrongWords = []; ds.forEach(function (d) { (d.wrong || []).forEach(function (w) { if (wrongWords.indexOf(w) < 0) wrongWords.push(w); }); });
  if (ds.length) kids.push(h('section', { class: 'card' }, h('h2', null, '听写'), h('p', null, wrongWords.length ? '这周写错过的：' + wrongWords.slice(0, 30).join('、') : '这周的听写全部写对了。')));
  if (done.length) kids.push(h('section', { class: 'card' }, h('h2', null, '这周新掌握的'), h('p', null, done.map(function (m) { return m.knowledge; }).filter(function (v, i, a) { return a.indexOf(v) === i; }).join('、'))));

  if (weak.length && S.sample) {
    if (rep.busy) kids.push(busyBox('正在安排下周的练习…', function () { rep.ctl.abort(); }));
    else {
      if (rep.text) kids.push(h('section', { class: 'card' }, h('h2', null, '下周怎么练'), h('p', { class: 'pre' }, rep.text)));
      if (rep.error) kids.push(h('p', { class: 'notice' }, rep.error));
      kids.push(h('button', { type: 'button', class: 'btn ' + (rep.text ? '' : 'primary ') + 'block', onclick: function () {
        rep.busy = true; rep.error = ''; rep.ctl = new AbortController(); render();
        var prompt = '你在帮家长安排小学' + KIDS[S.child].grade + '孩子下周的课后练习，每天不超过 15 分钟，不要大量刷题。\n' +
          '孩子目前还没掌握的知识点（科目、知识点、错的次数、主要错因）：\n' + weak.map(function (g) {
            var top = Object.keys(g.causes).sort(function (a, b) { return g.causes[b] - g.causes[a]; })[0];
            return g.subject + '，' + g.knowledge + '，' + g.n + ' 次，' + (CAUSE[top] || '');
          }).join('\n') + (wrongWords.length ? '\n本周听写写错的：' + wrongWords.slice(0, 20).join('、') : '') +
          '\n请写出下周的安排，最多 4 行，每行一条，格式是“周一至周三：练什么，每天几题，注意什么”。只写这几行，不要标题，不要其他说明。';
        S.sample(prompt, { signal: rep.ctl.signal, modelTier: 'quick', cache: false }).then(function (r) { rep.text = str(r.text, 600).trim(); })
          .catch(function (e) { rep.error = aiMsg(e); }).then(function () { rep.busy = false; if (S.tab === 'report') render(); });
      } }, rep.text ? '重新安排' : '安排下周的练习'));
    }
  }
  return kids;
}

/* ---------- 总装 ---------- */
var TITLES = { today: '今天的学习', capture: '拍错题', notebook: '错题本', dictation: '听写', report: '周报', practice: '练习' };
function render() {
  var view = S.tab === 'today' ? todayView() : S.tab === 'capture' ? captureView() : S.tab === 'notebook' ? notebookView()
    : S.tab === 'dictation' ? dictationView() : S.tab === 'report' ? reportView() : practiceView();
  var title = S.tab === 'practice' && S.prac && S.prac.mode === 'oral' ? '口算练习' : S.tab === 'practice' ? '针对练习' : TITLES[S.tab];
  var app = document.getElementById('app');
  app.setAttribute('data-mod', navInfo()[3]);
  app.replaceChildren(topView(title));
  add(app, noticeView()); add(app, h('main', { class: 'stack', style: 'gap:16px' }, view)); add(app, railView());
}
function boot() {
  render();
  var c = window.claude;
  if (!c || typeof c.use !== 'function') { S.outside = true; S.dbChecked = S.sampleChecked = true; render(); return; }
  c.use('db').then(function (db) { S.db = db; S.dbChecked = true; if (db) subscribe(); else S.loaded = true; render(); });
  c.use('sample').then(function (s) {
    S.sample = s; S.sampleChecked = true;
    if (!s) { render(); return; }
    return s.limits().catch(function () { return null; }).then(function (caps) {
      if (caps && caps.images) { S.canImages = true; if (caps.images.mediaTypes && caps.images.mediaTypes.length) S.imgTypes = caps.images.mediaTypes.join(','); }
      if (S.tab === 'today' || S.tab === 'capture' || S.tab === 'notebook' || S.tab === 'report' || (S.tab === 'dictation' && S.dict.phase === 'setup' && !S.dict.text)) render();
    });
  });
}
boot();
})();
</script>
